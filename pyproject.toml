[project]
name = "market-research-scraper"
version = "0.1.0"
description = "Scrapes and summarizes institutional investment research"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "anthropic>=0.40",
    "supabase>=2.10",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.9",
]

[project.scripts]
scraper = "scraper.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"
